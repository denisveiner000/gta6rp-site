<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090b12">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
  <meta name="description" content="GTA VI — фанатская промо-страница. Исследуй мир, смотри трейлеры и последние новости.">
  <title>GTA VI — Welcome to Leonida</title>
  <style>
    :root{
      --bg:#090b12;--panel:#111522;--text:#f7f4ef;--muted:#b8b5bd;
      --pink:#ff4f91;--orange:#ff9b52;--cyan:#70d7e8;--line:rgba(255,255,255,.14);
      --max:1200px;
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif;line-height:1.55}
    a{color:inherit;text-decoration:none}
    button{font:inherit}
    .container{width:min(var(--max),calc(100% - 48px));margin-inline:auto}
    .topbar{position:absolute;z-index:10;top:0;left:0;width:100%;border-bottom:1px solid rgba(255,255,255,.18);background:linear-gradient(180deg,rgba(5,7,13,.7),transparent)}
    .nav{min-height:82px;display:flex;align-items:center;justify-content:space-between;gap:24px}
    .brand{font-weight:900;letter-spacing:.16em;font-size:19px;text-transform:uppercase}
    .brand span{color:var(--pink)}
    .nav-links{display:flex;align-items:center;gap:30px;color:#eee;font-size:12px;font-weight:800;letter-spacing:.15em;text-transform:uppercase}
    .nav-links a{opacity:.82;transition:.2s}
    .nav-links a:hover{opacity:1;color:var(--pink)}
    .nav-cta,.primary-btn{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:0 22px;border:0;border-radius:3px;background:linear-gradient(110deg,var(--pink),#ff8d65);color:#160d16;font-size:11px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;transition:transform .2s,filter .2s}
    .nav-cta:hover,.primary-btn:hover{transform:translateY(-2px);filter:brightness(1.08)}
    .menu-toggle{display:none;background:none;border:1px solid var(--line);color:white;padding:9px 12px;border-radius:3px}
    .hero{min-height:100svh;position:relative;overflow:hidden;display:flex;align-items:center;padding:130px 0 100px;background:#080a10}
    .hero-video{position:absolute;inset:0;z-index:0;overflow:hidden;background:#080a10}
    .hero-video iframe{position:absolute;top:50%;left:50%;width: max(100vw,177.78vh);height:max(56.25vw,100vh);transform:translate(-50%,-50%);border:0;pointer-events:none}
    .hero:before{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(90deg,rgba(5,7,13,.78),rgba(5,7,13,.24) 75%),linear-gradient(0deg,var(--bg),transparent 34%)}
    .hero:after{content:"";position:absolute;inset:0;z-index:1;background:rgba(5,7,13,.08);pointer-events:none}
    .hero-sound{position:absolute;z-index:3;right:max(24px,calc((100vw - var(--max))/2));bottom:34px;border:1px solid rgba(255,255,255,.55);background:rgba(5,7,13,.55);color:#fff;padding:11px 15px;border-radius:3px;font-size:10px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;backdrop-filter:blur(8px)}
    .hero-content{position:relative;z-index:2;max-width:690px}
    .eyebrow{display:flex;align-items:center;gap:12px;color:#ffe1d6;font-size:11px;font-weight:800;letter-spacing:.28em;text-transform:uppercase}
    .eyebrow:before{content:"";width:38px;height:2px;background:var(--pink)}
    .hero h1{font-size:clamp(66px,11vw,142px);line-height:.78;letter-spacing:-.075em;margin:28px 0 24px;text-transform:uppercase;text-shadow:0 8px 35px rgba(0,0,0,.25)}
    .hero h1 span{display:block;color:#ffd3c2;font-size:.42em;letter-spacing:.16em;line-height:1.3;margin-left:8px}
    .hero-copy{max-width:480px;color:#f5e8e4;font-size:16px;margin:0 0 30px}
    .hero-actions{display:flex;flex-wrap:wrap;gap:13px}
    .ghost-btn{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:0 22px;border:1px solid rgba(255,255,255,.55);border-radius:3px;color:#fff;font-size:11px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;background:rgba(10,12,20,.16);cursor:pointer}
    .hero-note{margin-top:50px;color:rgba(255,255,255,.7);font-size:10px;letter-spacing:.16em;text-transform:uppercase}
    .section{padding:105px 0}
    .section-kicker{color:var(--pink);font-size:10px;font-weight:900;letter-spacing:.24em;text-transform:uppercase}
    .section-title{font-size:clamp(34px,5vw,62px);line-height:.98;letter-spacing:-.05em;text-transform:uppercase;margin:12px 0 18px}
    .section-intro{max-width:620px;color:var(--muted);margin:0}
    .video-section{background:linear-gradient(180deg,#090b12,#151322);padding:92px 0}
    .video-frame{margin-top:34px;position:relative;aspect-ratio:16/9;width:100%;overflow:hidden;border:1px solid rgba(255,255,255,.18);border-radius:6px;background:#05060a;box-shadow:0 24px 80px rgba(0,0,0,.4)}
    .video-frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
    .video-caption{display:flex;justify-content:space-between;gap:18px;align-items:center;margin-top:16px;color:var(--muted);font-size:12px}
    .video-caption a{color:#ffd0c6;text-decoration:underline;text-underline-offset:4px}
    .updates{background:linear-gradient(180deg,#090b12,#101421)}
    .cards{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:42px}
    .card{position:relative;min-height:300px;overflow:hidden;background:#171b29;border:1px solid var(--line);border-radius:5px;display:flex;flex-direction:column;justify-content:flex-end;padding:25px;isolation:isolate}
    .card:before{content:"";position:absolute;inset:0;z-index:-2;transition:transform .45s}
    .card:hover:before{transform:scale(1.06)}
    .card:nth-child(1):before{background:radial-gradient(circle at 75% 20%,#ffb47e,transparent 28%),linear-gradient(140deg,#5b2e4a,#e66d78 58%,#222b44)}
    .card:nth-child(2):before{background:radial-gradient(circle at 70% 22%,#ffc66c,transparent 25%),linear-gradient(145deg,#172c43,#287b88 60%,#e18c68)}
    .card:nth-child(3):before{background:radial-gradient(circle at 70% 25%,#ff9a83,transparent 25%),linear-gradient(145deg,#31213c,#a54f67 58%,#f0a16b)}
    .card:after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(0deg,rgba(5,7,13,.94),transparent 78%)}
    .card-tag{font-size:9px;font-weight:900;letter-spacing:.2em;color:#ffd1c7;text-transform:uppercase}
    .card h3{font-size:25px;line-height:1.05;text-transform:uppercase;margin:9px 0}
    .card p{color:#d6d0d4;font-size:13px;margin:0;max-width:300px}
    .world{display:grid;grid-template-columns:1fr 1fr;gap:60px;align-items:center}
    .world-art{min-height:450px;position:relative;overflow:hidden;border-radius:5px;background:radial-gradient(circle at 70% 30%,#ffb27d,transparent 28%),linear-gradient(145deg,#243c52,#b45d69 60%,#f4a46d)}
    .world-art:before{content:"LEONIDA";position:absolute;left:7%;bottom:8%;font-size:clamp(44px,8vw,100px);font-weight:900;letter-spacing:-.08em;color:rgba(255,255,255,.8)}
    .world-art:after{content:"";position:absolute;right:10%;bottom:0;width:34%;height:65%;background:linear-gradient(90deg,#101522,#283144);clip-path:polygon(30% 0,48% 0,48% 20%,70% 20%,70% 38%,100% 38%,100% 100%,0 100%,0 35%,30% 35%)}
    .feature-list{display:grid;gap:18px;margin-top:32px}
    .feature{display:grid;grid-template-columns:42px 1fr;gap:15px;align-items:start}
    .feature-num{width:36px;height:36px;border:1px solid rgba(255,79,145,.7);color:var(--pink);display:grid;place-items:center;font-size:12px;font-weight:900}
    .feature h3{font-size:14px;text-transform:uppercase;letter-spacing:.08em;margin:0 0 5px}
    .feature p{font-size:13px;color:var(--muted);margin:0}
    .gallery{background:#0e111b}
    .gallery-grid{display:grid;grid-template-columns:1.2fr .8fr .8fr;grid-template-rows:190px 190px;gap:14px;margin-top:38px}
    .gallery-tile{border-radius:4px;overflow:hidden;position:relative;background:linear-gradient(135deg,#4c3650,#e57c7a 55%,#f6b47b)}
    .gallery-tile:nth-child(2){background:linear-gradient(145deg,#1d5261,#ed9a70)}
    .gallery-tile:nth-child(3){background:linear-gradient(145deg,#332a46,#e15e7c)}
    .gallery-tile:nth-child(4){background:linear-gradient(145deg,#1b3146,#d68a6e)}
    .gallery-tile:nth-child(5){background:linear-gradient(145deg,#493044,#f4b17c)}
    .gallery-tile:first-child{grid-row:span 2}
    .gallery-tile:after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(5,7,13,.45),transparent)}
    .gallery-tile span{position:absolute;z-index:1;left:18px;bottom:15px;font-size:10px;font-weight:900;letter-spacing:.18em;text-transform:uppercase}
    .cta-band{padding:75px 0;background:linear-gradient(100deg,#492b48,#c85e78 55%,#e99b6d);text-align:center}
    .cta-band h2{font-size:clamp(34px,6vw,68px);line-height:.95;text-transform:uppercase;letter-spacing:-.06em;margin:0 0 15px}
    .cta-band p{color:#fff0e9;margin:0 auto 25px;max-width:520px;font-size:14px}
    .cta-band .primary-btn{background:#fff;color:#21131d}
    footer{padding:35px 0;background:#070910;color:#85838d}
    .footer-row{display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap}
    .footer-brand{color:#fff;font-weight:900;letter-spacing:.15em}
    .footer-small{font-size:10px;letter-spacing:.08em}
    .modal{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.82);display:none;place-items:center;padding:24px}
    .modal.open{display:grid}
    .modal-box{width:min(760px,100%);background:#111522;border:1px solid var(--line);padding:24px;position:relative;border-radius:5px}
    .modal-close{position:absolute;right:14px;top:12px;background:none;border:0;color:white;font-size:28px;cursor:pointer}
    .video-placeholder{aspect-ratio:16/9;display:grid;place-items:center;text-align:center;background:radial-gradient(circle at center,#70405b,#151b2c 70%);color:#fff;padding:20px}
    .video-placeholder strong{display:block;font-size:clamp(25px,5vw,48px);letter-spacing:-.04em}
    .video-placeholder span{color:#ddd;font-size:12px}
    @media(max-width:800px){
      .nav{min-height:70px}.nav-links{display:none;position:absolute;top:70px;left:24px;right:24px;padding:20px;background:#101421;border:1px solid var(--line);flex-direction:column;align-items:flex-start;gap:18px}
      .nav-links.show{display:flex}.nav-cta{display:none}.menu-toggle{display:block}
      .hero{min-height:100svh}
      .cards{grid-template-columns:1fr}.card{min-height:250px}
      .world{grid-template-columns:1fr;gap:32px}.world-art{min-height:300px}
      .gallery-grid{grid-template-columns:1fr 1fr;grid-template-rows:180px 150px 150px}
      .gallery-tile:first-child{grid-row:auto;grid-column:span 2}
    }
    @media(max-width:480px){
      .container{width:min(100% - 32px,var(--max))}
      .hero{min-height:100svh;padding-top:120px}.hero h1{font-size:68px}.hero-copy{font-size:14px}
      .section{padding:75px 0}.gallery-grid{gap:9px;grid-template-rows:160px 125px 125px}
      .footer-row{align-items:flex-start;flex-direction:column}
    }
    @media(max-width:480px){.hero-sound{right:16px;bottom:18px}.hero-video iframe{width:max(100vw,177.78vh);height:max(56.25vw,100vh)}}
    @media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*:before,*:after{transition:none!important}}
  
    html,body{height:100%;overflow:hidden}
    .topbar{height:104px}
    .sale-tag{margin-left:auto;background:linear-gradient(100deg,#ff4e91,#ff8768);color:#090b12;padding:18px 28px;font-size:12px;font-weight:950;letter-spacing:.14em}
    .hero{height:calc(100svh - 104px);min-height:560px;padding:0;display:flex;align-items:center}
    .hero-content{max-width:900px;padding-top:0}
    .sale-content .eyebrow{margin-bottom:28px}
    .sale-title{font-size:clamp(64px,10vw,150px);line-height:.86;letter-spacing:-.065em;font-weight:1000;margin:0;text-transform:uppercase;text-shadow:0 8px 38px rgba(0,0,0,.45)}
    .sale-title span{color:#ffb5a4}
    .sale-game span{color:#ff8ca9;letter-spacing:.12em}\n    .sale-game{font-size:clamp(30px,5vw,64px);font-weight:1000;letter-spacing:.22em;margin-top:30px;color:#fff}
    .video-shade{position:absolute;inset:0;z-index:1;pointer-events:none;background:linear-gradient(90deg,rgba(4,6,10,.82),rgba(4,6,10,.22) 78%),linear-gradient(0deg,rgba(4,6,10,.55),transparent 55%)}
    .sale-content{z-index:2}
    .hero-sound{z-index:4}
    @media(max-width:600px){.topbar{height:76px}.hero{height:calc(100svh - 76px);min-height:500px}.sale-tag{padding:13px 15px;font-size:9px}.sale-title{font-size:clamp(54px,13vw,88px)}.sale-game{margin-top:22px}}
\n  
    .telegram-link{display:inline-flex;align-items:center;gap:12px;margin-top:34px;padding:16px 24px;background:#229ed9;color:#fff;text-decoration:none;font-size:12px;font-weight:950;letter-spacing:.12em;border:1px solid rgba(255,255,255,.35);box-shadow:0 12px 35px rgba(0,0,0,.28);transition:transform .2s,background .2s}
    .telegram-link:hover{background:#168ac2;transform:translateY(-3px)}
    .telegram-icon{font-size:19px;line-height:1}
    @media(max-width:600px){.telegram-link{margin-top:25px;padding:14px 18px;font-size:10px}}

  
    .brand{display:inline-flex;align-items:center;gap:10px}
    .brand-role{display:inline-block;font-size:10px;line-height:1;letter-spacing:.18em;font-weight:900;color:#fff;border:1px solid rgba(255,255,255,.75);padding:7px 9px;margin-left:2px;vertical-align:middle}
    @media(max-width:600px){.brand-role{font-size:8px;padding:6px 7px;letter-spacing:.12em}}

  </style>
</head>
<body>
  <header class="topbar">
    <div class="container nav">
      <a class="brand" href="#home" aria-label="GTA VI ROLE PLAY">GTA <span>VI</span><small class="brand-role">SAMP ROLE PLAY</small></a>
      <div class="sale-tag">ДОМЕН В ПРОДАЖЕ</div>
    </div>
  </header>

  <main>
    <section class="hero" id="home">
      <div class="hero-video" aria-hidden="true">
        <iframe id="heroTrailer"
          src="https://www.youtube-nocookie.com/embed/VQRLujxTm3c?autoplay=1&mute=1&controls=0&loop=1&playlist=VQRLujxTm3c&playsinline=1&enablejsapi=1&rel=0&modestbranding=1"
          title="GTA VI — фоновое видео"
          allow="autoplay; encrypted-media; picture-in-picture"
          referrerpolicy="strict-origin-when-cross-origin"></iframe>
      </div>
      <div class="container hero-content sale-content">
        <div class="eyebrow">Grand Theft Auto VI · Leonida</div>
        <h1 class="sale-title">ДОМЕН<br><span>В ПРОДАЖЕ</span></h1>
        <div class="sale-game">GTA VI <span>ROLE PLAY</span></div>
        <a class="telegram-link" href="https://t.me/gta6_sampRP" target="_blank" rel="noopener noreferrer">
          <span class="telegram-icon" aria-hidden="true">➤</span>
          НАПИСАТЬ В TELEGRAM
        </a>
      </div>
      <div class="video-shade"></div>
      <button class="hero-sound" id="heroSound" type="button" aria-pressed="false">Включить звук</button>
    </section>
  </main>

  <script>
    const heroTrailer = document.getElementById('heroTrailer');
    const heroSound = document.getElementById('heroSound');
    let soundEnabled = false;

    heroSound.addEventListener('click', () => {
      soundEnabled = !soundEnabled;
      heroTrailer.contentWindow.postMessage(JSON.stringify({
        event: 'command',
        func: soundEnabled ? 'unMute' : 'mute',
        args: []
      }), 'https://www.youtube-nocookie.com');
      heroSound.textContent = soundEnabled ? 'Выключить звук' : 'Включить звук';
      heroSound.setAttribute('aria-pressed', String(soundEnabled));
    });
  </script>
</body>
</html>
